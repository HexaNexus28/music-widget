<svg width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#DA70D6"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="80" fill="#1E1E2F"/>

  <!-- Lettres M et Y -->
  <path d="M90 380 L90 180 L180 280 L270 180 L270 380" stroke="url(#violetGradient)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M300 180 L370 280 L440 180 M370 280 L370 380" stroke="url(#violetGradient)" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Ondes pulsantes autour des lettres -->
  <circle cx="256" cy="256" r="120" stroke="#8A2BE2" stroke-width="4" fill="none" opacity="0.5">
    <animate attributeName="r" values="120;140;120" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="80" stroke="#DA70D6" stroke-width="4" fill="none" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
